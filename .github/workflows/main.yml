name: Build mods

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - kujama09-visuals
          - kujama09-hands
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: ${{ matrix.project }}/build/libs/*.jar
